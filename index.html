<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Social Media Demo</title>

<!-- Firebase Libraries -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f0f2f5; margin:0; padding:0; }
.page { display:flex; justify-content:center; align-items:center; height:100vh; }
#feedPage { display:none; flex-direction:column; }
.login-box { background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:300px; }
.login-box input, .login-box button { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc; }
.login-box button { border:none; background:#1877f2; color:white; cursor:pointer; }
.login-box button:hover { background:#155db2; }
header { background:#1877f2; color:white; padding:15px; text-align:center; }
.container { width:90%; max-width:800px; margin:20px auto; display:flex; gap:20px; }
.newsfeed { flex:2; }
.post-form textarea { width:100%; padding:10px; border-radius:5px; border:1px solid #ccc; resize:none; min-height:60px; }
.post-form button { margin-top:10px; padding:10px; background:#42b72a; color:white; border:none; border-radius:5px; cursor:pointer; }
.post { background:white; padding:15px; border-radius:8px; margin-bottom:15px; box-shadow:0 0 5px rgba(0,0,0,0.1); }
.post .author { font-weight:bold; margin-bottom:5px; }
.post .actions { margin-top:10px; display:flex; gap:10px; }
button.like-btn { background:#e4e6eb; color:#050505; }
button.like-btn.liked { background:#1877f2; color:white; }
.chat-box { flex:1; background:white; padding:15px; border-radius:8px; height:400px; display:flex; flex-direction:column; box-shadow:0 0 5px rgba(0,0,0,0.1); }
.chat-messages { flex:1; overflow-y:auto; margin-bottom:10px; }
.chat-input { display:flex; gap:5px; }
.chat-input input { flex:1; padding:10px; border-radius:5px; border:1px solid #ccc; }
.chat-input button { padding:10px; border:none; border-radius:5px; background:#1877f2; color:white; cursor:pointer; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page">
    <div class="login-box">
        <h3>Login</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p>Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
    </div>
</div>

<!-- SIGNUP PAGE -->
<div id="signupPage" class="page" style="display:none;">
    <div class="login-box">
        <h3>Sign Up</h3>
        <input type="email" id="newEmail" placeholder="Email">
        <input type="password" id="newPassword" placeholder="Password">
        <button onclick="signup()">Create Account</button>
        <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
    </div>
</div>

<!-- FEED PAGE -->
<div id="feedPage">
    <header>
        <h2>Firebase Social Media</h2>
    </header>
    <div class="container">
        <!-- Newsfeed -->
        <div class="newsfeed">
            <div class="post-form">
                <textarea id="postContent" placeholder="What's on your mind?"></textarea>
                <button onclick="createPost()">Post</button>
                <button onclick="logout()" style="background:#ff4d4d;margin-top:5px;">Logout</button>
            </div>
            <div id="feed"></div>
        </div>
        <!-- Chat Box -->
        <div class="chat-box">
            <h4>Chat</h4>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
// Firebase Config

const firebaseConfig = {
  apiKey: "AIzaSyDsv8RWUmKiD867SW9R5rnFBeg4CvezaAc",
  authDomain: "geeprojectweb.firebaseapp.com",
  projectId: "geeprojectweb",
  storageBucket: "geeprojectweb.firebasestorage.app",
  messagingSenderId: "530105175206",
  appId: "1:530105175206:web:10643b7e94bc11cbc5f867",
  measurementId: "G-ZQN9W77M1F"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Pages
function showSignup(){ document.getElementById("loginPage").style.display="none"; document.getElementById("signupPage").style.display="flex"; }
function showLogin(){ document.getElementById("signupPage").style.display="none"; document.getElementById("loginPage").style.display="flex"; }

// Signup
function signup(){
    const email=document.getElementById("newEmail").value;
    const password=document.getElementById("newPassword").value;
    auth.createUserWithEmailAndPassword(email,password)
        .then(()=>{ alert("Account created! Login now."); showLogin(); })
        .catch(e=>alert(e.message));
}

// Login
function login(){
    const email=document.getElementById("email").value;
    const password=document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email,password)
        .then(user=>{
            currentUser = user.user.email;
            document.getElementById("loginPage").style.display="none";
            document.getElementById("signupPage").style.display="none";
            document.getElementById("feedPage").style.display="flex";
            renderPosts(); renderChat();
        })
        .catch(e=>alert(e.message));
}

// Logout
function logout(){ auth.signOut(); currentUser=""; document.getElementById("feedPage").style.display="none"; document.getElementById("loginPage").style.display="flex"; }

// Current user
let currentUser="";

// Newsfeed Posts
function createPost(){
    const content=document.getElementById("postContent").value.trim();
    if(!content) return alert("Write something!");
    const postId = db.ref("posts").push().key;
    db.ref("posts/"+postId).set({author:currentUser, content:content, likes:0});
    document.getElementById("postContent").value="";
}

// Render Posts
function renderPosts(){
    db.ref("posts").on("value",snapshot=>{
        const feed=document.getElementById("feed"); feed.innerHTML="";
        snapshot.forEach(child=>{
            const post=child.val();
            const postId=child.key;
            const postEl=document.createElement("div");
            postEl.className="post";
            postEl.innerHTML=`
                <div class="author">${post.author}</div>
                <p>${post.content}</p>
                <div class="actions">
                    <button class="like-btn" onclick="likePost('${postId}')">👍 Like (${post.likes})</button>
                </div>
            `;
            feed.appendChild(postEl);
        });
    });
}

// Like Post
function likePost(id){
    const ref = db.ref("posts/"+id);
    ref.once("value").then(snap=>{
        const likes = snap.val().likes || 0;
        ref.update({likes: likes+1});
    });
}

// Chat
function sendMessage(){
    const msg=document.getElementById("chatInput").value.trim();
    if(!msg) return;
    const msgId = db.ref("messages").push().key;
    db.ref("messages/"+msgId).set({sender:currentUser, text:msg});
    document.getElementById("chatInput").value="";
}

// Render Chat
function renderChat(){
    db.ref("messages").on("value",snapshot=>{
        const chatBox=document.getElementById("chatMessages");
        chatBox.innerHTML="";
        snapshot.forEach(child=>{
            const msg=child.val();
            const msgEl=document.createElement("div");
            msgEl.innerHTML=`<strong>${msg.sender}:</strong> ${msg.text}`;
            chatBox.appendChild(msgEl);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}
</script>
</body>
</html>
